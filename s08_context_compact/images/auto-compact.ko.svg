<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans KR&quot;, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="38" fill="url(#header)" rx="8"/>
  <rect x="0" y="30" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="25" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">4단계: compact_history, 기록 요약</text>

  <!-- 트리거 조건 -->
  <rect x="20" y="54" width="680" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="35" y="70" fill="#991b1b" font-size="11" font-weight="600">트리거 조건</text>
  <text x="140" y="70" fill="#991b1b" font-size="11">micro_compact 후 estimate_chars(messages) &gt; CONTEXT_CHAR_LIMIT.</text>
  <text x="140" y="86" fill="#991b1b" font-size="10">현재 CONTEXT_CHAR_LIMIT은 50,000자.</text>

  <!-- Steps -->
  <rect x="20" y="106" width="200" height="110" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="130" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">1단계: transcript 저장</text>
  <text x="40" y="152" fill="#475569" font-size="10">대화를 .transcripts/에 기록</text>
  <text x="40" y="168" fill="#475569" font-size="10">한 줄에 JSONL 메시지 하나</text>
  <text x="40" y="184" fill="#475569" font-size="10">파일: transcript_{uuid}.jsonl</text>
  <text x="40" y="200" fill="#94a3b8" font-size="9">전체 transcript는 디스크에 남음</text>

  <line x1="225" y1="161" x2="265" y2="161" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="106" width="200" height="110" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="370" y="130" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">2단계: 사실 기반 요약</text>
  <text x="370" y="152" fill="#475569" font-size="9" text-anchor="middle">대화는 요약할 데이터로 취급</text>
  <text x="290" y="166" fill="#475569" font-size="9">요약이 보존하는 5가지 항목:</text>
  <text x="370" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">목표 · 발견과 결정 · 파일</text>
  <text x="370" y="192" fill="#94a3b8" font-size="8" text-anchor="middle">남은 작업 · 사용자 제약</text>
  <text x="370" y="204" fill="#94a3b8" font-size="8" text-anchor="middle">행동을 제안하거나 고르지 않음</text>

  <line x1="475" y1="161" x2="515" y2="161" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="106" width="180" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="130" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">3단계: 기록 교체</text>
  <text x="610" y="152" fill="#991b1b" font-size="9" text-anchor="middle">이전 기록 → 메시지 1개</text>
  <text x="610" y="168" fill="#991b1b" font-size="9" text-anchor="middle">요청 + 대화 요약</text>
  <text x="610" y="184" fill="#991b1b" font-size="9" text-anchor="middle">시스템이 지시/데이터를 분리</text>
  <text x="610" y="200" fill="#ef4444" font-size="9" text-anchor="middle">transcript는 디스크에 남음</text>

  <!-- Before/After comparison -->
  <rect x="20" y="234" width="320" height="94" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="180" y="256" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">이전 messages</text>
  <rect x="35" y="264" width="52" height="16" rx="3" fill="#e2e8f0"/><text x="40" y="276" fill="#475569" font-size="8">user</text>
  <rect x="92" y="264" width="52" height="16" rx="3" fill="#e2e8f0"/><text x="97" y="276" fill="#475569" font-size="8">assistant</text>
  <rect x="149" y="264" width="52" height="16" rx="3" fill="#e2e8f0"/><text x="154" y="276" fill="#475569" font-size="8">user</text>
  <rect x="206" y="264" width="52" height="16" rx="3" fill="#e2e8f0"/><text x="211" y="276" fill="#475569" font-size="8">assistant</text>
  <rect x="263" y="264" width="52" height="16" rx="3" fill="#e2e8f0"/><text x="268" y="276" fill="#475569" font-size="8">user</text>
  <text x="180" y="318" fill="#94a3b8" font-size="9" text-anchor="middle">메시지 다수, 추정 크기 &gt; 50,000</text>

  <line x1="345" y1="281" x2="375" y2="281" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="234" width="320" height="94" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="540" y="256" fill="#991b1b" font-size="11" font-weight="600" text-anchor="middle">이후 messages</text>
  <rect x="395" y="264" width="290" height="32" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="540" y="276" fill="#991b1b" font-size="9" text-anchor="middle">Current user request: 입력 시점에 포착</text>
  <text x="540" y="290" fill="#991b1b" font-size="9" text-anchor="middle">Conversation summary: 사실과 남은 작업</text>
  <text x="540" y="318" fill="#94a3b8" font-size="9" text-anchor="middle">요약 메시지 하나, 한도보다 훨씬 작음</text>

  <!-- Error recovery -->
  <rect x="20" y="340" width="680" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="35" y="362" fill="#475569" font-size="11" font-weight="600">오류 복구:</text>
  <text x="125" y="362" fill="#475569" font-size="10">API가 여전히 prompt_too_long을 반환하면 reactive_compact를 실행하고 1회만 재시도.</text>
</svg>
