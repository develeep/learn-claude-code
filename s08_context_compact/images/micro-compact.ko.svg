<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, sans-serif, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans KR&quot;, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ca8a04"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="38" fill="url(#header)" rx="8"/>
  <rect x="0" y="30" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="25" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">3단계: micro_compact, 오래된 결과 교체</text>

  <!-- Pain Point -->
  <rect x="20" y="54" width="680" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="35" y="70" fill="#991b1b" font-size="11" font-weight="600">문제</text>
  <text x="110" y="68" fill="#991b1b" font-size="10">10번 읽은 뒤에도 결과 1-7이 컨텍스트에 남아 있음.</text>
  <text x="110" y="82" fill="#991b1b" font-size="10">공간만 차지하고 더 이상 쓸모가 없음.</text>

  <!-- Before -->
  <text x="155" y="114" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle">이전 (tool_result 10개 모두 전체 유지)</text>
  <rect x="20" y="122" width="310" height="95" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="30" y="130" width="290" height="10" rx="2" fill="#e2e8f0"/>
  <text x="38" y="138" fill="#94a3b8" font-size="8" font-family="monospace">Read file A: (전체 내용, 3200자)...</text>
  <rect x="30" y="145" width="290" height="10" rx="2" fill="#e2e8f0"/>
  <text x="38" y="153" fill="#94a3b8" font-size="8" font-family="monospace">Read file B: (전체 내용, 1800자)...</text>
  <rect x="30" y="160" width="290" height="10" rx="2" fill="#e2e8f0"/>
  <text x="38" y="168" fill="#94a3b8" font-size="8" font-family="monospace">Read file C: (전체 내용, 4500자)...</text>
  <rect x="30" y="175" width="290" height="10" rx="2" fill="#fef3c7"/>
  <text x="38" y="183" fill="#92400e" font-size="8" font-family="monospace">Read file J: (전체 내용, 2800자)</text>
  <text x="175" y="212" fill="#ef4444" font-size="9" font-weight="600">오래된 결과 7개가 ~25K자 낭비</text>

  <!-- Arrow -->
  <line x1="335" y1="170" x2="375" y2="170" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- After -->
  <text x="535" y="114" fill="#ca8a04" font-size="12" font-weight="600" text-anchor="middle">이후 (최근 3개만 전체 유지)</text>
  <rect x="390" y="122" width="310" height="95" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <rect x="400" y="130" width="290" height="10" rx="2" fill="#fef3c7"/>
  <text x="408" y="138" fill="#92400e" font-size="8" font-family="monospace">[Earlier tool result saved at .task_outputs/...]</text>
  <rect x="400" y="145" width="290" height="10" rx="2" fill="#fef3c7"/>
  <text x="408" y="153" fill="#92400e" font-size="8" font-family="monospace">[Earlier tool result saved at .task_outputs/...]</text>
  <rect x="400" y="160" width="290" height="10" rx="2" fill="#fef3c7"/>
  <text x="408" y="168" fill="#92400e" font-size="8" font-family="monospace">[Earlier tool result saved at .task_outputs/...]</text>
  <rect x="400" y="175" width="290" height="10" rx="2" fill="#fef3c7"/>
  <text x="408" y="183" fill="#92400e" font-size="8" font-family="monospace">Read file J: (전체 내용, 2800자)</text>
  <text x="545" y="212" fill="#ca8a04" font-size="9" font-weight="600" text-anchor="middle">최근 3개 유지, 앞 7개는 복구 경로로 바뀜</text>

  <!-- How -->
  <rect x="20" y="228" width="680" height="62" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="35" y="248" fill="#1e3a5f" font-size="11" font-weight="600">규칙</text>
  <text x="75" y="248" fill="#475569" font-size="10">최근 3개 유지. 컨텍스트가 80%에 이를 때까지 오래된 결과를 저장하고 줄임.</text>
  <text x="35" y="264" fill="#1e3a5f" font-size="11" font-weight="600">복구</text>
  <text x="95" y="264" fill="#475569" font-size="10">줄인 결과마다 .task_outputs/ 아래의 신뢰할 수 있는 경로가 남음.</text>
  <text x="105" y="280" fill="#94a3b8" font-size="9">메시지 구조는 다음 루프 반복에서도 유효함.</text>
</svg>
