<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, sans-serif, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans KR&quot;, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="38" fill="url(#header)" rx="8"/>
  <rect x="0" y="30" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="25" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">메모리 시스템 — 저장 · 불러오기 · 추출 · 정리</text>

  <!-- Storage -->
  <rect x="40" y="58" width="145" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="112" y="80" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">저장</text>
  <line x1="55" y1="90" x2="170" y2="90" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="55" y="108" fill="#5b21b6" font-size="10">.memory/*.md 파일</text>
  <text x="55" y="124" fill="#5b21b6" font-size="10">MEMORY.md 인덱스</text>

  <line x1="190" y1="98" x2="218" y2="98" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Recall -->
  <rect x="222" y="58" width="200" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="322" y="80" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">불러오기</text>
  <line x1="237" y1="90" x2="407" y2="90" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="237" y="108" fill="#5b21b6" font-size="10">시스템 프롬프트에 인덱스</text>
  <text x="237" y="124" fill="#5b21b6" font-size="10">모델이 관련 파일 선택</text>
  <text x="237" y="134" fill="#a78bfa" font-size="9">최대 5개, 실패 시 키워드 매칭</text>

  <line x1="425" y1="98" x2="453" y2="98" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Extraction -->
  <rect x="457" y="58" width="130" height="80" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="522" y="80" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">추출</text>
  <line x1="472" y1="90" x2="572" y2="90" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="472" y="106" fill="#5b21b6" font-size="9.5">턴 종료 후</text>
  <text x="472" y="121" fill="#5b21b6" font-size="9.5">오래 쓸 지식 추출</text>
  <text x="472" y="134" fill="#a78bfa" font-size="8.5">범위 + 중복 검사</text>

  <!-- Consolidation -->
  <rect x="600" y="58" width="100" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="80" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle">정리</text>
  <line x1="615" y1="90" x2="685" y2="90" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="615" y="106" fill="#5b21b6" font-size="9.5">파일 10개 이상</text>
  <text x="615" y="121" fill="#5b21b6" font-size="9.5">중복 제거 · 병합</text>
  <text x="615" y="134" fill="#a78bfa" font-size="8.5">스냅숏 + 롤백</text>

  <!-- Memory Files -->
  <rect x="40" y="180" width="660" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="370" y="203" fill="#475569" font-size="11" text-anchor="middle">.memory/ — MEMORY.md 인덱스 + *.md 파일 (YAML 프런트매터: name / description / type)</text>

  <!-- Arrow: Storage → Memory Files -->
  <path d="M 112 138 L 112 180" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="162" fill="#7c3aed" font-size="9">읽기/쓰기</text>

  <!-- Arrow: Extraction → Memory Files -->
  <path d="M 522 138 L 522 180" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="536" y="164" fill="#7c3aed" font-size="9">쓰기</text>

  <!-- Arrow: Consolidation → Memory Files -->
  <path d="M 650 138 L 650 180" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="662" y="164" fill="#7c3aed" font-size="9">덮어쓰기</text>

  <!-- Four types -->
  <rect x="40" y="240" width="660" height="40" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="0.5"/>
  <text x="60" y="260" fill="#5b21b6" font-size="10" font-weight="600">네 가지 유형:</text>
  <text x="140" y="260" fill="#475569" font-size="10">user (사용자 정보) · feedback (작업 방식) · project (진행 상황) · reference (찾을 위치)</text>

</svg>
